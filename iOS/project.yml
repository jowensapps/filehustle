name: FileHustle
options:
  bundleIdPrefix: com.hustle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: AKUJ9V4SZ3
    CODE_SIGN_STYLE: Automatic
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  FileHustle:
    type: application
    platform: iOS
    sources:
      - path: FileHustle
        excludes:
          - Supplementary-Info.plist
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hustle.filehustleios
        GENERATE_INFOPLIST_FILE: YES
        # Merges in NSBonjourServices (array — can't be expressed as a plain
        # INFOPLIST_KEY_* build setting) and the local-network usage string.
        INFOPLIST_FILE: FileHustle/Supplementary-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: FileHustle
        # No custom encryption, no backend — everything is a direct
        # peer-to-peer LAN connection via Network.framework/TLS defaults.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
