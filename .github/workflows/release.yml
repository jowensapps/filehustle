name: Build and release (Windows)

# Builds FileHustle from the tagged source:
#   - FileHustle.exe   single-file exe for the GitHub Releases download
#   - FileHustle.msix  package for Microsoft Store submission (the Store
#                      signs it; it is not installable on its own)
#
# - Push a tag like v1.3.1 to build and create a DRAFT GitHub release.
# - Run manually (Actions tab -> Run workflow) to just build and download
#   the artifacts without publishing anything.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the draft release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content Windows/FileHustle.csproj
          $version = ($proj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "<Version> in FileHustle.csproj must be major.minor.patch (got '$version')"
            exit 1
          }
          if ('${{ github.ref }}'.StartsWith('refs/tags/v')) {
            $tag = '${{ github.ref_name }}'.TrimStart('v')
            if ($version -ne $tag) {
              Write-Error "Tag v$tag does not match <Version>$version</Version> in FileHustle.csproj"
              exit 1
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish single-file exe
        working-directory: Windows
        run: >
          dotnet publish -r win-x64 -c Release --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ../out/exe

      - name: Publish app folder for MSIX
        working-directory: Windows
        run: dotnet publish -r win-x64 -c Release --self-contained true -o ../out/msix-root

      - name: Build MSIX package
        shell: pwsh
        run: |
          $root = 'out/msix-root'
          # Manifest with the package version (Store requires 4th part = 0)
          $manifest = Get-Content Windows/Package/AppxManifest.xml -Raw
          $manifest = $manifest -replace 'Version="0\.0\.0\.0"', 'Version="${{ steps.version.outputs.version }}.0"'
          Set-Content "$root/AppxManifest.xml" $manifest -Encoding utf8
          Copy-Item Windows/Package/Images "$root/Images" -Recurse

          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $makeappx) { Write-Error 'makeappx.exe not found'; exit 1 }
          & $makeappx.FullName pack /d $root /p out/FileHustle.msix /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: FileHustle-exe
          path: out/exe/FileHustle.exe
          if-no-files-found: error

      - name: Upload MSIX
        uses: actions/upload-artifact@v7
        with:
          name: FileHustle-msix
          path: out/FileHustle.msix
          if-no-files-found: error

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: out/exe/FileHustle.exe
          generate_release_notes: true
